# Local development: full stack on your laptop.
#   cp .env.example .env   (add GROQ_API_KEY and GEMINI_API_KEY)
#   docker compose up --build
#   open http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studyrag
      POSTGRES_USER: studyrag
      POSTGRES_PASSWORD: studyrag-local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyrag"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studyrag:studyrag-local@db:5432/studyrag
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
