# Runs inside the "web" container (nginx-unprivileged, port 8080, non-root).
# Traffic path in production: Browser -> CloudFront (HTTPS) -> ALB -> this Nginx -> FastAPI.
# TLS is terminated at CloudFront/ALB, so this server speaks plain HTTP inside the VPC.

# Client IP = first entry of X-Forwarded-For (CloudFront/ALB add it); direct hits use the socket IP.
# A client can prepend a fake XFF value, so this edge limit is best-effort; the API's
# per-user limits (keyed on the verified JWT) are the authoritative ones.
map $http_x_forwarded_for $client_ip {
    "~^(?P<first>[^,\s]+)" $first;
    default                $remote_addr;
}

# Edge rate limit per client IP (second layer; the API also limits per user)
limit_req_zone $client_ip zone=api:10m rate=20r/s;
limit_req_status 429;

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 21m;   # 20 MB upload limit + multipart overhead
    client_body_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # If the backend container is down/restarting, Nginx itself returns 502/504:
        # answer with JSON instead of an HTML error page. (Backend's own JSON errors pass through.)
        error_page 502 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"detail":"Service is restarting, please retry in a few seconds"}';
    }

    # Static React build
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;

        # index.html must be revalidated on every load: it names the hashed bundle, and a stale
        # copy after a deploy points at a bundle that no longer exists (blank page).
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
