name: Deploy

# Runs after CI succeeds on main: build images -> push to GHCR -> rolling deploy to EC2 via SSM.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # GitHub OIDC -> short-lived AWS credentials (no AWS keys stored in GitHub)

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image names
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        run: |
          IMG=ghcr.io/${{ steps.img.outputs.owner }}/studyrag-backend
          docker build -t $IMG:${{ steps.img.outputs.tag }} -t $IMG:latest ./backend
          docker push --all-tags $IMG

      - name: Build and push web
        run: |
          IMG=ghcr.io/${{ steps.img.outputs.owner }}/studyrag-web
          docker build -t $IMG:${{ steps.img.outputs.tag }} -t $IMG:latest -f frontend/Dockerfile .
          docker push --all-tags $IMG

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rolling deploy (one instance at a time, waits for health)
        env:
          IMAGE_TAG: ${{ steps.img.outputs.tag }}
        run: bash deploy/scripts/rolling_deploy.sh
